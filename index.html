<title>虎力全开·高项学习计划//一期 2026</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#185FA5;--blue-l:#EAF3FB;--teal:#1D9E75;--teal-l:#E6F5EF;--coral:#D85A30;
  --text:#23211C;--muted:#8A857C;--line:#E8E5DD;--line2:#F1EEE7;--surface:#F7F6F2;
  --amber:#B97A1E;--amber-l:#FDF4E3;--r:10px;
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);background:#fff;font-size:13px;line-height:1.45;
  height:100vh;overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:#fff}
.brand{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.ts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;min-width:0}
.stat .k{font-size:10px;color:var(--muted);letter-spacing:.3px;white-space:nowrap}
.stat .v{font-size:13.5px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .v em{font-style:normal;font-size:10.5px;font-weight:400;color:var(--muted);margin-left:2px}
.stat.prog{position:relative;overflow:hidden;min-width:132px}
.pbar{height:3px;border-radius:2px;background:#E6E2D9;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal);width:0;transition:.3s}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:6px 11px;font-size:12px;white-space:nowrap;transition:.14s}
.btn:hover{border-color:#CFC9BC;background:#FCFBF8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#134E88}
.btn.ghost{color:var(--muted)}
.btn.sm{padding:4px 8px;font-size:11px}

/* ---------- 布局 ---------- */
.layout{display:flex;height:calc(100vh - 55px);align-items:stretch}
.calarea{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:12px 16px 40px}
.side{width:340px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#FCFBF8;min-height:0}

/* ---------- 工具条 ---------- */

/* ---------- 月历 ---------- */
.month{margin-bottom:20px}
.month-h{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.month-h h2{font-size:14px;font-weight:650;margin:0}
.month-h .m-sub{font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--muted);padding:1px 0 3px;letter-spacing:1px}
.cal-dow.we{color:var(--teal)}

.cell{min-height:104px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:4px 5px;display:flex;flex-direction:column;gap:2px;overflow:visible;cursor:pointer;transition:.12s;position:relative}
.cell:hover{border-color:#BFD6EA;box-shadow:0 1px 6px rgba(24,95,165,.08)}
.cell.out{background:#FBFBF9;border-style:dashed;cursor:default;opacity:.45}
.cell.out:hover{border-color:var(--line);box-shadow:none}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--blue)}
.cell.over{background:var(--blue-l);border-color:var(--blue);border-style:dashed}
.cell.doneall{background:#FAFEFC}
.cell.undone{background:#FDF0EE;border-color:#E0A69C}
.cell.undone .c-d{color:var(--coral)}
.cell.undone .c-hh{color:var(--coral)}
.c-h{display:flex;align-items:center;gap:4px;font-size:11px;min-height:16px}
.c-d{font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums}
.cell.today .c-d{color:var(--blue)}
.c-w{color:var(--muted);font-size:10px}
.c-hh{margin-left:auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-hh b{color:var(--blue);font-weight:650}
.c-hh .ok{color:var(--teal);font-weight:650}

/* 分区标题 */
.c-sec{display:flex;align-items:center;gap:3px;font-size:9px;color:#B0AB9F;letter-spacing:.5px;margin-top:1px}
.c-sec::after{content:"";flex:1;height:1px;background:var(--line2)}

/* 学习任务 */
.c-tks{display:flex;flex-direction:column;gap:2px;min-height:0}
.tk{display:flex;align-items:flex-start;gap:4px;font-size:10.5px;line-height:1.4;background:var(--blue-l);color:#15548F;border-radius:5px;padding:2px 5px 2px 3px}
.tk .chk{margin-top:1.5px}
.tk .tkt{flex:1;min-width:0;word-break:break-all}
.tk .tkn{font-weight:650;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.tk.on{background:var(--teal-l);color:#12674E}
.tk.on .tkt{color:#1C5B47}
.more{font-size:9.5px;color:var(--muted);padding-left:2px}

/* 其他安排 */
.c-extras{display:flex;flex-direction:column;gap:2px;min-height:0}
.ex{display:flex;align-items:center;gap:3px;font-size:10px;line-height:1.35;background:var(--amber-l);color:#8A5F1E;border-radius:5px;padding:1px 4px;overflow:hidden;white-space:nowrap}
.ex .ext{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ex .exdot{flex:none;width:4px;height:4px;border-radius:50%;background:#D9A94E}
.c-empty{font-size:10px;color:#D6D1C7;border:1px dashed #EAE7DF;border-radius:5px;padding:2px 4px;text-align:center;margin-top:1px}
.c-note{font-size:9.5px;color:#9A948A;line-height:1.35;border-left:2px solid #EDE9E0;padding-left:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* 勾选框：打勾，不划掉 */
.chk{width:13px;height:13px;border-radius:3.5px;border:1.4px solid #CBC5B9;background:#fff;flex:none;position:relative;transition:.12s;cursor:pointer}
.chk:hover{border-color:var(--teal)}
.chk.on{background:var(--teal);border-color:var(--teal)}
.chk.on::after{content:"";position:absolute;left:3.5px;top:.5px;width:3.5px;height:7px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(40deg)}
.chk.none{border-color:transparent;background:transparent;cursor:default;pointer-events:none}

/* ---------- 周汇总 ---------- */
.wsec{margin-top:8px}
.wsec h3{font-size:13px;font-weight:650;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.wsec h3 span{font-weight:400;font-size:11px;color:var(--muted)}
.wscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wt{width:100%;border-collapse:collapse;font-size:12px}
table.wt th{text-align:right;font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.3px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
table.wt th:first-child,table.wt th:nth-child(2){text-align:left}
table.wt td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
table.wt td:first-child,table.wt td:nth-child(2){text-align:left;white-space:nowrap}
table.wt tr:hover td{background:#FCFBF8}
table.wt tr.total td{font-weight:650;background:var(--surface);border-bottom:none}
.wtag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;background:var(--blue-l);color:var(--blue);font-weight:600}
.wtag.rest{background:#F1EFE9;color:#8A857C}
.nowrow td{background:#FFFBEF}

/* ---------- 侧栏目录 ---------- */
.side-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line);font-size:13px;font-weight:650;background:#fff}
.side-h .cnt{font-weight:400;font-size:10.5px;color:var(--muted)}
.side-h .mini{margin-left:auto;display:flex;gap:5px}
.side-t{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff;align-items:center}
.side-t input[type=search]{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;background:var(--surface);color:var(--text);outline:none}
.side-t input[type=search]:focus{border-color:#BFD6EA;background:#fff}
.tgl{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
#catalog{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 6px 60px}
.cat-item{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:6px;cursor:grab;font-size:11.5px;line-height:1.4;position:relative}
.cat-item:hover{background:#F2EFE8}
.cat-item.drag{opacity:.45}
.cat-item.lv1{font-weight:650;font-size:12px;margin-top:5px;background:#F7F6F2}
.cat-item.lv1:hover{background:#EFECE4}
.cat-item.lv2{padding-left:14px;color:#3B3833}
.cat-item.lv3{padding-left:28px;color:#5A554C;font-size:11px}
.cat-item .caret{width:12px;flex:none;color:var(--muted);font-size:9px;text-align:center;cursor:pointer}
.cat-item .num{flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:10.5px;min-width:44px}
.cat-item.lv1 .num{min-width:40px;color:var(--blue)}
.cat-item .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item.done .tt{color:#12674E;font-weight:600}
.cat-item .pg{flex:none;font-size:9.5px;color:#B6B0A5;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-item .daytag{flex:none;font-size:9.5px;padding:0 4px;border-radius:4px;background:var(--blue-l);color:var(--blue);font-variant-numeric:tabular-nums}
.cat-item.pick{background:#FDF4E3;box-shadow:inset 0 0 0 1px #E9C877}

/* ---------- 选中提示条 ---------- */
#selbar{position:fixed;left:50%;bottom:-70px;transform:translateX(-50%);background:#23211C;color:#fff;border-radius:22px;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:12px;box-shadow:0 6px 22px rgba(0,0,0,.22);transition:.22s;z-index:60;max-width:92vw}
#selbar.on{bottom:18px}
#selbar .sbn{opacity:.65;font-size:11px;white-space:nowrap}
#selbar .sbt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#selbar button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:14px;padding:3px 10px;font-size:11px}

/* ---------- 当日面板 ---------- */
#daypanel{position:fixed;inset:0;z-index:70;display:none}
#daypanel.on{display:block}
.dp-mask{position:absolute;inset:0;background:rgba(28,26,22,.28)}
.dp-card{position:absolute;right:0;top:0;bottom:0;width:440px;max-width:100vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.13);display:flex;flex-direction:column;animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(18px);opacity:.6}to{transform:none;opacity:1}}
.dp-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dp-h b{font-size:15px}
.dp-h .tag{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--blue-l);color:var(--blue);font-weight:600}
.dp-h .tag.we{background:var(--teal-l);color:var(--teal)}
.dp-h .x{margin-left:auto;border:none;background:var(--surface);color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:15px;line-height:1}
.dp-b{flex:1;overflow-y:auto;padding:14px 16px 26px}
.fld{margin-bottom:14px}
.fld .lb{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.fld .lb .r{margin-left:auto;font-size:10.5px;color:#A9A399}
.fld .lb b{color:var(--text);font-weight:600}
.ih{display:flex;align-items:center;gap:6px}
.ih input[type=number]{width:80px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;color:var(--text);text-align:center;font-variant-numeric:tabular-nums}
.ih input[type=number]:focus{outline:none;border-color:var(--blue)}
.ih span{font-size:12px;color:var(--muted)}
.dp-list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.dp-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--line2);font-size:12px}
.dp-item:last-child{border-bottom:none}
.dp-item .n{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;min-width:40px}
.dp-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-item.on .t{color:#12674E;font-weight:600}
.dp-item .del{border:none;background:none;color:#C6C0B5;font-size:13px;padding:0 2px;flex:none}
.dp-item .del:hover{color:var(--coral)}

/* 其他安排编辑 */
.ex-row{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1px solid var(--line2);font-size:12px}
.ex-row:last-child{border-bottom:none}
.ex-row .et{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-size:12px;padding:2px 0}
.ex-row .et:focus{outline:none}
.ex-row .exdot{flex:none;width:5px;height:5px;border-radius:50%;background:#D9A94E}
.ex-row .del{border:none;background:none;color:#C6C0B5;font-size:13px;padding:0 2px;flex:none}
.ex-row .del:hover{color:var(--coral)}
.ex-add{display:flex;gap:6px;margin-top:6px}
.ex-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px}
.ex-add input:focus{outline:none;border-color:var(--blue)}
.dp-empty{font-size:11.5px;color:var(--muted);padding:12px;text-align:center}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;line-height:1.55;color:var(--text);resize:vertical;background:#FDFCFA;min-height:76px}
textarea:focus{outline:none;border-color:var(--blue);background:#fff}

/* ---------- 历史快照 ---------- */
#snapmodal{position:fixed;inset:0;z-index:80;display:none;background:rgba(28,26,22,.3)}
#snapmodal.on{display:block}
.sm-card{position:absolute;left:50%;top:9%;transform:translateX(-50%);width:520px;max-width:94vw;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.22);max-height:78vh;display:flex;flex-direction:column}
.sm-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:650;font-size:14px}
.sm-h .x{margin-left:auto;border:none;background:var(--surface);color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:15px}
.sm-b{overflow-y:auto;padding:8px 12px 16px}
.snap{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line2);font-size:12px}
.snap:last-child{border-bottom:none}
.snap .tm{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.snap .meta{color:var(--muted);font-size:11px;flex:1}
.snap button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-size:11px}
.snap button.d:hover{border-color:var(--coral);color:var(--coral)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-14px);opacity:0;background:#23211C;color:#fff;border-radius:8px;padding:8px 14px;font-size:12px;z-index:90;transition:.2s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 窄屏 ---------- */
@media (max-width:1000px){
  body{height:auto;overflow:auto}
  .layout{height:auto;flex-direction:column}
  .calarea{overflow:visible;padding:10px 10px 20px}
  .side{width:auto;border-left:none;border-top:1px solid var(--line);max-height:none}
  #catalog{max-height:58vh}
  .cal{min-width:620px}
  .month{overflow-x:auto}
  .cell{min-height:96px}
  .topbar{padding:8px 10px;gap:8px}
  .brand{font-size:14px}
  .acts{width:100%;order:9;margin-left:0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .acts .btn{flex:none}
  .dp-card{width:100%;border-radius:14px 14px 0 0;top:auto;height:auto;max-height:88vh}
  .dp-h{padding:13px 14px}
  .dp-b{padding:12px 14px 24px}
  .ih input[type=number]{width:92px;padding:9px;font-size:16px}
  .dp-item{padding:10px 9px;font-size:13px}
  .dp-item .chk{width:17px;height:17px}
  .dp-item .chk.on::after{left:5px;top:1px;width:4.5px;height:9px}
  .cat-item{padding:6px 5px;font-size:12.5px}
  .cat-item.lv3{font-size:12px}
  table.wt{min-width:540px}
  #selbar{bottom:-90px}
  #selbar.on{bottom:12px}
}
@media (max-width:560px){
  .stat{padding:3px 7px}
  .stat.small{display:none}
  table.wt{font-size:11px}
  table.wt th,table.wt td{padding:5px 4px}
}
</style>
</head>

/* ========== 状态 ========== */
let state = newState();
let A2D = {};
let selIdx = -1;
let openKey = null;
let collapsed = {};

function newState() {
  const days = {};
  DAYS.forEach(d => {
    const sp = SPECIAL_DAYS[d.k];
    days[d.k] = {
      h: sp && sp.h != null ? sp.h : defaultH(d.dow),
      c: [], note: '',
      ex: dayExtras(d.k, d.dow)
    };
  });
  return { v: 4, days: days, done: {}, snaps: [], mpp: 8, defW: 2, defThu: 1.5, defE: 4 };
}
function load() {
  try {
    const raw = localStorage.getItem(CK);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (!o || o.v !== 4) return;
    state.days = o.days || {};
    state.done = o.done || {};
    state.snaps = o.snaps || [];
    state.mpp = o.mpp || 8;
    state.defW = o.defW == null ? 2 : o.defW;
    state.defThu = o.defThu == null ? 1.5 : o.defThu;
    state.defE = o.defE == null ? 4 : o.defE;
    DAYS.forEach(d => {
      const sp = SPECIAL_DAYS[d.k];
      if (!state.days[d.k]) state.days[d.k] = { h: sp && sp.h != null ? sp.h : defaultH(d.dow), c: [], note: '', ex: dayExtras(d.k, d.dow) };
      const x = state.days[d.k];
      x.c = (x.c || []).filter(i => typeof i === 'number' && i >= 0 && i < CAT.length);
      x.note = x.note || '';
      x.h = Number(x.h) || 0;
      if (!Array.isArray(x.ex)) x.ex = dayExtras(d.k, d.dow);
      // 特定日期：确保固定活动存在 + 时长覆盖为指定值
      if (sp) {
        if (sp.h != null) x.h = sp.h;
        if (sp.ex) sp.ex.forEach(function (e) { if (x.ex.indexOf(e) < 0) x.ex.push(e); });
      }
    });
  } catch (e) {}
}
let stTimer = null;
function save() {
  clearTimeout(stTimer);
  stTimer = setTimeout(() => {
    try { localStorage.setItem(CK, JSON.stringify(state)); } catch (e) {}
  }, 100);
}
function dayOf(k) {
  if (!state.days[k]) {
    const dow = DAYMAP[k].dow;
    const sp = SPECIAL_DAYS[k];
    state.days[k] = { h: sp && sp.h != null ? sp.h : defaultH(dow), c: [], note: '', ex: dayExtras(k, dow) };
  }
  return state.days[k];
}
function rebuildMap() {
  A2D = {};
  DAYS.forEach(d => {
    const x = state.days[d.k];
    if (!x || !x.c) return;
    x.c.forEach(i => { A2D[i] = d.k; });
  });
}
function isDone(i) { return !!state.done[i]; }
function doneCount() { let n = 0; for (const k in state.done) if (state.done[k]) n++; return n; }

function pagesOf(k) {
  const x = state.days[k];
  if (!x || !x.c) return 0;
  let s = 0;
  x.c.forEach(i => { s += (CAT[i] && CAT[i].pp) || 0; });
  return s;
}

/* ========== 日历 ========== */
function todayKey() { return dk(new Date()); }

function cellHTML(k) {
  const d = DAYMAP[k];
  if (!d) {
    return '<div class="cell out"><div class="c-h"><span class="c-d">' + Number(k.slice(8)) + '</span></div></div>';
  }
  const x = state.days[k] || { h: 0, c: [], note: '', ex: [] };
  const tk = x.c || [];
  const dn = tk.filter(i => isDone(i)).length;
  const allDone = tk.length > 0 && dn === tk.length;
  // 过期未完成：日期已过（或今天已过 8 点）且有分配任务但未全部勾选
  const now = new Date();
  const passed = k < todayKey() || (k === todayKey() && now.getHours() >= 8);
  const undone = passed && tk.length > 0 && dn < tk.length;
  let h = '<div class="cell' + (k === todayKey() ? ' today' : '') + (allDone ? ' doneall' : '') + (undone ? ' undone' : '') + '" data-k="' + k + '">';
  h += '<div class="c-h"><span class="c-d">' + Number(k.slice(8)) + '</span><span class="c-w">' + WD[d.dow] + '</span>';
  h += '<span class="c-hh">';
  if (x.h > 0) h += '<b>' + fmtH(x.h) + 'h</b>';
  if (tk.length) h += '<span class="ok" style="margin-left:3px">' + dn + '/' + tk.length + '</span>';
  h += '</span></div>';

  // 学习计划区（全部展示，不折叠）
  if (tk.length) {
    h += '<div class="c-sec">学习计划</div>';
    h += '<div class="c-tks">';
    tk.forEach(i => {
      const c = CAT[i];
      if (!c) return;
      h += '<div class="tk' + (isDone(i) ? ' on' : '') + '" data-i="' + i + '" title="' + esc(c.num + ' ' + c.t + '（' + c.pp + '页）') + '">';
      h += '<span class="chk' + (isDone(i) ? ' on' : '') + '"></span>';
      h += '<span class="tkn">' + esc(c.num) + '</span><span class="tkt">' + esc(c.t) + '</span></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="c-sec">学习计划</div><div class="c-empty">拖入任务</div>';
  }

  // 其他安排区
  const ex = x.ex || [];
  if (ex.length) {
    h += '<div class="c-sec">其他安排</div>';
    h += '<div class="c-extras">';
    ex.slice(0, 2).forEach(e => {
      h += '<div class="ex" title="' + esc(e) + '"><span class="exdot"></span><span class="ext">' + esc(e) + '</span></div>';
    });
    if (ex.length > 2) h += '<div class="more">还有 ' + (ex.length - 2) + ' 项</div>';
    h += '</div>';
  }

  if (x.note) h += '<div class="c-note">' + esc(x.note) + '</div>';
  h += '</div>';
  return h;
}

function renderCal() {
  const months = [[S_Y, S_M], [E_Y, E_M]];
  let h = '';
  months.forEach(function (mm) {
    const y = mm[0], m = mm[1];
    const dim = new Date(y, m + 1, 0).getDate();
    // 该月渲染起始日：不早于计划起始日 STARTK（11 月从 9 号起，12 月从 1 号起）
    let startDay = 1;
    const monthStartK = y + '-' + p2(m + 1) + '-01';
    if (STARTK > monthStartK) startDay = Number(STARTK.slice(8));
    const firstD = new Date(y, m, startDay);
    const off = (firstD.getDay() + 6) % 7;
    let inR = 0;
    for (let i = startDay; i <= dim; i++) {
      const k = y + '-' + p2(m + 1) + '-' + p2(i);
      if (k >= STARTK && k <= ENDK) inR++;
    }
    h += '<div class="month"><div class="month-h"><h2>' + y + ' 年 ' + (m + 1) + ' 月</h2>';
    h += '<span class="m-sub">计划覆盖 ' + inR + ' 天</span></div><div class="cal">';
    ['一','二','三','四','五','六','日'].forEach(function (w, i) {
      h += '<div class="cal-dow' + (i >= 5 ? ' we' : '') + '">' + w + '</div>';
    });
    for (let i = 0; i < off; i++) h += '<div class="cell out" style="opacity:.15"></div>';
    for (let i = startDay; i <= dim; i++) {
      const k = y + '-' + p2(m + 1) + '-' + p2(i);
      if (k >= STARTK && k <= ENDK) h += cellHTML(k);
      else h += '<div class="cell out"><div class="c-h"><span class="c-d">' + i + '</span></div></div>';
    }
    h += '</div></div>';
  });
  document.getElementById('calwrap').innerHTML = h;
}

/* ========== 统计 ========== */
function renderStats() {
  const total = LEAF_TOTAL;
  const dn = doneCount();
  document.getElementById('s-prog').innerHTML = dn + ' / ' + total + ' <em>已完成</em>';
  document.getElementById('s-bar-done').style.width = (total ? dn / total * 100 : 0) + '%';

  let th = 0, wd = 0, we = 0, asg = 0;
  DAYS.forEach(function (d) {
    const x = state.days[d.k];
    if (!x) return;
    const h = Number(x.h) || 0;
    th += h;
    if (d.work) wd += h; else we += h;
    asg += (x.c || []).length;
  });
  document.getElementById('s-h').innerHTML = fmtH(th) + '<em>h</em>';
  document.getElementById('s-wd').innerHTML = fmtH(wd) + '<em>h</em>';
  document.getElementById('s-we').innerHTML = fmtH(we) + '<em>h</em>';
  document.getElementById('s-asg').innerHTML = asg + '<em>条</em>';

  let totPg = 0;
  CAT.forEach(function (c, i) { if (isLeaf(i)) totPg += c.pp; });
  document.getElementById('s-pg').innerHTML = totPg + '<em>页</em>';
}

function renderWeeks() {
  let rows = '', tH = 0, tW = 0, tE = 0, tTask = 0, tDone = 0, tAsg = 0;
  WEEKS.forEach(function (w, wi) {
    let wh = 0, eh = 0, task = 0, done = 0, asg = 0;
    w.forEach(function (d) {
      const x = state.days[d.k];
      if (!x) return;
      const h = Number(x.h) || 0;
      if (d.work) wh += h; else eh += h;
      const c = x.c || [];
      asg += c.length;
      task += c.length;
      done += c.filter(i => isDone(i)).length;
    });
    const tot = wh + eh;
    tH += tot; tW += wh; tE += eh; tTask += task; tDone += done; tAsg += asg;
    const tagCls = w.length < 5 ? ' rest' : '';
    const isNow = w.some(d => d.k === todayKey());
    rows += '<tr' + (isNow ? ' class="nowrow"' : '') + '>';
    rows += '<td><span class="wtag' + tagCls + '">第 ' + (wi + 1) + ' 周</span></td>';
    rows += '<td>' + md(w[0].k) + ' – ' + md(w[w.length - 1].k) + '</td>';
    rows += '<td>' + w.length + '</td>';
    rows += '<td>' + (wh > 0 ? fmtH(wh) + ' h' : '—') + '</td>';
    rows += '<td>' + (eh > 0 ? fmtH(eh) + ' h' : '—') + '</td>';
    rows += '<td><b>' + (tot > 0 ? fmtH(tot) + ' h' : '—') + '</b></td>';
    rows += '<td>' + (task ? done + ' / ' + task : '—') + '</td>';
    rows += '<td>' + (asg || '—') + '</td>';
    rows += '</tr>';
  });
  rows += '<tr class="total"><td>合计</td><td>' + md(STARTK) + ' – ' + md(ENDK) + '</td><td>' + DAYS.length + '</td>';
  rows += '<td>' + fmtH(tW) + ' h</td><td>' + fmtH(tE) + ' h</td><td>' + fmtH(tH) + ' h</td>';
  rows += '<td>' + tDone + ' / ' + tTask + '</td><td>' + tAsg + '</td></tr>';
  document.getElementById('wtbody').innerHTML = rows;
}

/* ========== 目录 ========== */
function renderCatalog() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const onlyUndone = document.getElementById('onlyUndone').checked;
  let html = '', shown = 0;
  CAT.forEach(function (c, i) {
    if (c.lv > 1 && collapsed[c.ch]) return;
    const hit = !q || c.num.toLowerCase().indexOf(q) >= 0 || c.t.toLowerCase().indexOf(q) >= 0;
    if (!hit) return;
    if (onlyUndone && isDone(i)) return;
    shown++;
    const done = isDone(i);
    const leaf = isLeaf(i);
    const dayK = A2D[i];
    let cls = 'cat-item lv' + c.lv + (done ? ' done' : '') + (selIdx === i ? ' pick' : '');
    let h = '<div class="' + cls + '" data-i="' + i + '" draggable="true">';
    h += '<span class="caret">' + (c.lv === 1 ? (collapsed[c.ch] ? '▸' : '▾') : '') + '</span>';
    h += (leaf ? '<span class="chk' + (done ? ' on' : '') + '" data-t="' + i + '"></span>' : '<span class="chk none"></span>');
    h += '<span class="num">' + (c.lv === 1 ? '第' + c.num + '章' : esc(c.num)) + '</span>';
    h += '<span class="tt" title="' + esc(c.t) + '（P' + c.pg + ' · ' + c.pp + '页）">' + esc(c.t) + '</span>';
    h += '<span class="pg">' + (c.lv === 1 ? c.pp + '页' : c.pp + 'p') + '</span>';
    if (dayK) h += '<span class="daytag">' + md(dayK) + '</span>';
    h += '</div>';
    html += h;
  });
  if (!shown) html = '<div class="dp-empty">没有匹配的条目</div>';
  document.getElementById('catalog').innerHTML = html;
  document.getElementById('cat-cnt').textContent = '共 ' + LEAF_TOTAL + ' 个知识点';
}

function renderAll() {
  rebuildMap();
  renderCal();
  renderStats();
  renderWeeks();
  renderCatalog();
}

/* ========== 目录交互 ========== */
const catBox = document.getElementById('catalog');

catBox.addEventListener('click', function (e) {
  const chi = e.target.closest('.chk');
  if (chi) { toggleDone(+chi.dataset.t); return; }
  const item = e.target.closest('.cat-item');
  if (!item) return;
  const i = +item.dataset.i;
  const c = CAT[i];
  if (e.target.closest('.caret') && c.lv === 1) {
    collapsed[c.ch] = !collapsed[c.ch];
    renderCatalog();
    return;
  }
  selIdx = (selIdx === i) ? -1 : i;
  renderCatalog();
  renderSelbar();
});

catBox.addEventListener('dragstart', function (e) {
  const item = e.target.closest('.cat-item');
  if (!item) return;
  selIdx = +item.dataset.i;
  item.classList.add('drag');
  try {
    e.dataTransfer.setData('text/plain', String(selIdx));
    e.dataTransfer.effectAllowed = 'copyMove';
  } catch (err) {}
  renderSelbar();
});
catBox.addEventListener('dragend', function (e) {
  const item = e.target.closest('.cat-item');
  if (item) item.classList.remove('drag');
  document.querySelectorAll('.cell.over').forEach(c => c.classList.remove('over'));
});

/* ========== 日历交互 ========== */
const calwrap = document.getElementById('calwrap');

calwrap.addEventListener('click', function (e) {
  const chip = e.target.closest('.tk');
  const cell = e.target.closest('.cell');
  if (!cell || cell.classList.contains('out')) return;
  const k = cell.dataset.k;
  if (!k) return;
  if (chip) { toggleDone(+chip.dataset.i); return; }
  if (selIdx >= 0) { assign(selIdx, k); return; }
  openDay(k);
});

calwrap.addEventListener('dragover', function (e) {
  const cell = e.target.closest('.cell');
  if (!cell || cell.classList.contains('out')) return;
  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'copy'; } catch (err) {}
  document.querySelectorAll('.cell.over').forEach(c => { if (c !== cell) c.classList.remove('over'); });
  cell.classList.add('over');
});
calwrap.addEventListener('dragleave', function (e) {
  const cell = e.target.closest('.cell');
  if (cell) cell.classList.remove('over');
});
calwrap.addEventListener('drop', function (e) {
  e.preventDefault();
  const cell = e.target.closest('.cell');
  if (!cell) return;
  cell.classList.remove('over');
  const k = cell.dataset.k;
  if (!k || cell.classList.contains('out')) return;
  let i = -1;
  try { i = +e.dataTransfer.getData('text/plain'); } catch (err) {}
  if (isNaN(i) || i < 0) i = selIdx;
  if (i >= 0) assign(i, k);
});

function toggleDone(i) {
  if (state.done[i]) delete state.done[i];
  else state.done[i] = 1;
  save();
  renderAll();
  const c = CAT[i];
  toast(state.done[i] ? ('已打勾：' + c.num + ' ' + c.t) : ('已取消打勾：' + c.num + ' ' + c.t));
}

function assign(i, k) {
  const prev = A2D[i];
  if (prev === k) {
    toast('已在 ' + md(k) + '，无需重复');
    selIdx = -1; renderSelbar(); renderCatalog();
    return;
  }
  if (prev) {
    const pd = dayOf(prev);
    pd.c = pd.c.filter(x => x !== i);
  }
  const d = dayOf(k);
  if (d.c.indexOf(i) < 0) d.c.push(i);
  d.c.sort((a, b) => a - b);
  selIdx = -1;
  save();
  renderAll();
  renderSelbar();
  toast((prev ? '已从 ' + md(prev) + ' 移到 ' : '已排入 ') + md(k) + ' · 计划 ' + fmtH(d.h) + 'h');
}

/* ========== 选中条 ========== */
function renderSelbar() {
  const bar = document.getElementById('selbar');
  if (selIdx < 0) { bar.classList.remove('on'); return; }
  const c = CAT[selIdx];
  bar.querySelector('.sbn').textContent = LVN[c.lv] + ' 已选';
  document.getElementById('sel-txt').textContent = c.num + ' ' + c.t;
  bar.classList.add('on');
}
document.getElementById('sel-cancel').addEventListener('click', function () {
  selIdx = -1; renderSelbar(); renderCatalog();
});

/* ========== 当日面板 ========== */
function openDay(k) {
  openKey = k;
  const d = DAYMAP[k];
  const x = dayOf(k);
  document.getElementById('dp-title').textContent = Number(k.slice(5, 7)) + '月' + Number(k.slice(8)) + '日 · 周' + WD[d.dow];
  const tg = document.getElementById('dp-type');
  tg.textContent = d.work ? '工作日' : '周末';
  tg.className = 'tag' + (d.work ? '' : ' we');
  document.getElementById('dp-h').value = x.h || 0;
  document.getElementById('dp-pginfo').textContent = pagesOf(k) ? ('共 ' + pagesOf(k) + ' 页') : '未排任务';
  document.getElementById('dp-note').value = x.note || '';
  renderDpList();
  renderDpExtras();
  document.getElementById('daypanel').classList.add('on');
}
function renderDpList() {
  const k = openKey;
  if (!k) return;
  const x = dayOf(k);
  const c = x.c || [];
  const box = document.getElementById('dp-list');
  if (!c.length) {
    box.innerHTML = '<div class="dp-empty">当天还没有学习任务，把右侧目录拖进来</div>';
  } else {
    box.innerHTML = c.map(function (i) {
      const it = CAT[i];
      return '<div class="dp-item' + (isDone(i) ? ' on' : '') + '">' +
        '<span class="chk' + (isDone(i) ? ' on' : '') + '" data-tw="' + i + '"></span>' +
        '<span class="n">' + esc(it.num) + '</span>' +
        '<span class="t" title="' + esc(it.t) + '">' + esc(it.t) + '</span>' +
        '<span class="n" style="min-width:auto;color:#B3ADA2">' + it.pp + 'p</span>' +
        '<button class="del" data-rm="' + i + '">×</button></div>';
    }).join('');
  }
  const dn = c.filter(i => isDone(i)).length;
  document.getElementById('dp-cnt').textContent = c.length ? (dn + ' / ' + c.length + ' 已完成') : '';
}
function renderDpExtras() {
  const k = openKey;
  if (!k) return;
  const x = dayOf(k);
  const ex = x.ex || [];
  const box = document.getElementById('dp-extras');
  if (!ex.length) {
    box.innerHTML = '<div class="dp-empty">暂无其他安排</div>';
  } else {
    box.innerHTML = ex.map(function (e, i) {
      return '<div class="ex-row"><span class="exdot"></span>' +
        '<input class="et" value="' + esc(e) + '" data-exi="' + i + '">' +
        '<button class="del" data-exdel="' + i + '">×</button></div>';
    }).join('');
  }
}
document.getElementById('dp-list').addEventListener('click', function (e) {
  const ch = e.target.closest('[data-tw]');
  if (ch) { toggleDone(+ch.dataset.tw); renderDpList(); renderCal(); return; }
  const del = e.target.closest('[data-rm]');
  if (del) {
    const i = +del.dataset.rm;
    const x = dayOf(openKey);
    x.c = x.c.filter(y => y !== i);
    save(); renderAll(); renderDpList();
    document.getElementById('dp-pginfo').textContent = pagesOf(openKey) ? ('共 ' + pagesOf(openKey) + ' 页') : '未排任务';
    toast('已移出当天');
  }
});
/* 其他安排：编辑、删除、添加 */
document.getElementById('dp-extras').addEventListener('input', function (e) {
  const inp = e.target.closest('[data-exi]');
  if (!inp) return;
  const x = dayOf(openKey);
  const i = +inp.dataset.exi;
  x.ex[i] = inp.value;
  save(); renderCal();
});
document.getElementById('dp-extras').addEventListener('click', function (e) {
  const del = e.target.closest('[data-exdel]');
  if (!del) return;
  const x = dayOf(openKey);
  x.ex.splice(+del.dataset.exdel, 1);
  save(); renderDpExtras(); renderCal();
});
document.getElementById('ex-addbtn').addEventListener('click', function () {
  const inp = document.getElementById('ex-new');
  const v = inp.value.trim();
  if (!v) return;
  const x = dayOf(openKey);
  x.ex.push(v);
  inp.value = '';
  save(); renderDpExtras(); renderCal();
  toast('已添加其他安排');
});
document.getElementById('ex-new').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('ex-addbtn').click();
});
document.getElementById('dp-h').addEventListener('input', function (e) {
  const v = Math.max(0, Math.min(16, Number(e.target.value) || 0));
  dayOf(openKey).h = v;
  save();
  renderStats(); renderWeeks(); renderCal();
});
document.getElementById('dp-note').addEventListener('input', function (e) {
  dayOf(openKey).note = e.target.value;
  save();
  renderCal();
});
document.getElementById('dp-close').addEventListener('click', closeDay);
document.getElementById('dp-mask').addEventListener('click', closeDay);
function closeDay() {
  document.getElementById('daypanel').classList.remove('on');
  openKey = null;
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (document.getElementById('daypanel').classList.contains('on')) closeDay();
    if (document.getElementById('snapmodal').classList.contains('on')) document.getElementById('snapmodal').classList.remove('on');
    if (selIdx >= 0) { selIdx = -1; renderSelbar(); renderCatalog(); }
  }
});

document.getElementById('btn-expand').addEventListener('click', function () {
  collapsed = {}; renderCatalog();
});
document.getElementById('btn-collapse').addEventListener('click', function () {
  collapsed = {}; for (let i = 0; i < 24; i++) collapsed[i] = 1;
  renderCatalog();
});
document.getElementById('q').addEventListener('input', function () {
  if (document.getElementById('q').value.trim()) collapsed = {};
  renderCatalog();
});
document.getElementById('onlyUndone').addEventListener('change', renderCatalog);

/* ========== 保存 / 历史 ========== */
function snapshot() {
  const t = new Date();
  const label = t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate()) + ' ' + p2(t.getHours()) + ':' + p2(t.getMinutes());
  return {
    t: label,
    done: JSON.parse(JSON.stringify(state.done)),
    days: JSON.parse(JSON.stringify(state.days)),

document.getElementById('fileinput').addEventListener('change', function (e) {
  const f = e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = function () {
    try {
      const o = JSON.parse(fr.result);
      if (!o.days) throw new Error('缺少 days 字段');
      state.days = o.days; state.done = o.done || {};
      state.mpp = o.mpp || 8;
      state.defW = o.defW == null ? 2 : o.defW;
      state.defThu = o.defThu == null ? 1.5 : o.defThu;
      state.defE = o.defE == null ? 4 : o.defE;
      DAYS.forEach(function (d) {
        const sp = SPECIAL_DAYS[d.k];
        if (!state.days[d.k]) state.days[d.k] = { h: sp && sp.h != null ? sp.h : defaultH(d.dow), c: [], note: '', ex: dayExtras(d.k, d.dow) };
        const x = state.days[d.k];
        x.c = (x.c || []).filter(i => typeof i === 'number' && i >= 0 && i < CAT.length);
        x.note = x.note || ''; x.h = Number(x.h) || 0;
        if (!Array.isArray(x.ex)) x.ex = dayExtras(d.k, d.dow);
        if (sp) {
          if (sp.h != null) x.h = sp.h;
          if (sp.ex) sp.ex.forEach(function (e) { if (x.ex.indexOf(e) < 0) x.ex.push(e); });
        }
      });
      save(); renderAll();
      toast('已恢复备份');
    } catch (err) { alert('备份文件解析失败：' + err.message); }
  };
  fr.readAsText(f);
  e.target.value = '';
});

/* ========== 下载 ========== */
function download(blob, name) {
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () {
    if (a.parentNode) document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1200);
}

const CRCT = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRCT[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(entries) {

  entries.forEach(function (e) {
    const nameB = e.nameB, data = e.data, crc = crc32(data), size = data.length;
    const lh = new Uint8Array(30 + nameB.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x2100, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, nameB.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameB, 30);
    parts.push(lh, data);
    const cd = new Uint8Array(46 + nameB.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0x2100, true);
    cv.setUint16(14, 0x2100, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameB, 46);
    central.push(cd);
    offset += lh.length + size;
  });
  let cdSize = 0;
  central.forEach(function (c) { cdSize += c.length; });
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);
  return new Blob([...parts, ...central, eocd], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function xe(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}
function colName(n) {
  let s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function sheetXml(widths, rows) {
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  x += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x += '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  x += '<cols>' + widths.map(function (w, i) {
    return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
  }).join('') + '</cols>';
  x += '<sheetData>';
  rows.forEach(function (row, ri) {
    x += '<row r="' + (ri + 1) + '">';
    row.forEach(function (c, ci) {
      if (c === null || c === undefined || c === '') return;
      const ref = colName(ci + 1) + (ri + 1);
      const st = ri === 0 ? ' s="1"' : '';
      if (typeof c === 'number' && isFinite(c)) {
        x += '<c r="' + ref + '"' + st + '><v>' + c + '</v></c>';
      } else {
        x += '<c r="' + ref + '"' + st + ' t="inlineStr"><is><t xml:space="preserve">' + xe(c) + '</t></is></c>';
      }
    });
    x += '</row>';
  });
  x += '</sheetData></worksheet>';
  return x;

  // styleIdOf(ri,ci) -> style index (0-7)；表头行(ri=0)用样式1
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  x += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  x += '<sheetViews><sheetView workbookViewId="0"/></sheetViews>';
  x += '<cols>' + widths.map(function (w, i) {

  }).join('') + '</cols>';
  x += '<sheetData>';
  rows.forEach(function (row, ri) {
    x += '<row r="' + (ri + 1) + '">';
    row.forEach(function (c, ci) {
      if (c === null || c === undefined || c === '') return;
      const ref = colName(ci + 1) + (ri + 1);
      const sid = styleIdOf ? styleIdOf(ri, ci) : (ri === 0 ? 1 : 0);
      const st = ' s="' + sid + '"';
      if (typeof c === 'number' && isFinite(c)) {
        x += '<c r="' + ref + '"' + st + '><v>' + c + '</v></c>';

      }
    });
    x += '</row>';
  });
  x += '</sheetData></worksheet>';

  calStyles.push([1,1,1,1,1,1,1]);
  calRows.push(calCols.slice());
  calStyles.push([2,2,2,2,2,2,2]);

  months.forEach(function (mm) {
    const y = mm[0], m = mm[1];
    const dim = new Date(y, m + 1, 0).getDate();
    let startDay = 1;
    const monthStartK = y + '-' + p2(m + 1) + '-01';
    if (STARTK > monthStartK) startDay = Number(STARTK.slice(8));

    // 星期表头行
    calRows.push(calCols.slice());
    calStyles.push([2,2,2,2,2,2,2]);
    // 按周填充
    let week = new Array(7).fill('');
    let weekSty = new Array(7).fill(0);
    for (let i = 0; i < off; i++) { week[i] = ''; weekSty[i] = 0; }
    for (let i = startDay; i <= dim; i++) {
      const k = y + '-' + p2(m + 1) + '-' + p2(i);
      const col = (new Date(y, m, i).getDay() + 6) % 7;
      if (k >= STARTK && k <= ENDK) {
        const d = DAYMAP[k];
        const x = state.days[k] || { h: 0, c: [], note: '', ex: [] };
        const tk = x.c || [];
        const dn = tk.filter(i2 => isDone(i2)).length;
        const allDone = tk.length > 0 && dn === tk.length;
        const passed = k < todayKey() || (k === todayKey() && now.getHours() >= 8);
        const undone = passed && tk.length > 0 && dn < tk.length;
        const isToday = k === todayKey();
        let lines = [];

          const c = CAT[i2];

          lines.push((isDone(i2) ? '☑ ' : '▢ ') + c.num + ' ' + c.t);
        });
        (x.ex || []).forEach(function (e) {
          lines.push('· ' + e);
        });
        if (x.note) lines.push('『' + x.note + '』');
        week[col] = lines.join('\n');
        // 样式：过期未完成红(3/7)、全部完成绿(4)、今天蓝(6)、默认白(带边框3)
        if (undone) weekSty[col] = 7;
        else if (allDone) weekSty[col] = 4;
        else if (isToday) weekSty[col] = 6;
        else weekSty[col] = 3;
      } else {

        weekSty[col] = 5;
